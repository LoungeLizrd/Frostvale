<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>Frostvale</title>
<style>
:root{box-sizing:border-box;--bg:#10171f;--ink:#f4f8fc;--panel:#243447;--acc:#f2b632;--line:#3d5570;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--panel:#1b2735;--line:#2f4258}}

html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}

#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 122px);left:50%;transform:translateX(-50%);max-width:88%;background:#fff8e1;color:#3b2a10;padding:8px 12px;border-radius:12px;font-size:14px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#lotp{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 232px);background:rgba(20,30,44,.85);color:#fff;padding:5px 12px;border-radius:12px;font:700 13px 'Trebuchet MS',sans-serif;display:none;pointer-events:none;white-space:nowrap}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:128px;height:128px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4)}
#knob{position:absolute;left:44px;top:44px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.75)}
.b{position:fixed;width:78px;height:78px;border-radius:50%;border:3px solid #fff;background:rgba(40,60,90,.8);color:#fff;font:700 13px "Trebuchet MS",sans-serif}
#bTalk{right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
#bPlow{right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px)}
#bPlow.on{background:var(--acc);color:#2a1d05;border-color:#2a1d05}
#bMode{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);background:rgba(40,60,90,.85);color:#fff;border:2px solid #fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(5,10,18,.72);display:none;align-items:center;justify-content:center;padding:14px;touch-action:auto}
.pn{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px;width:100%;max-width:380px;max-height:88%;overflow:auto}
.pn h2{margin:0 0 6px;font-size:19px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button.k{flex:1;padding:9px 2px;font-size:13px}canvas.pv{width:48px;height:48px;image-rendering:pixelated;background:var(--bg);border-radius:8px}
button.k{background:var(--line);color:var(--ink);border:0;border-radius:10px;padding:9px 10px;font-weight:700;font-size:14px}
button.k.on,.item button{background:var(--acc);color:#2a1d05}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding:9px 0;font-size:14px}
.item small{display:block;opacity:.75}
.item button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px}
.item button:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.slot{aspect-ratio:1;background:var(--bg);border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative}
.slot i{position:absolute;right:4px;bottom:2px;font:700 12px sans-serif;font-style:normal}
.slot.s{border-color:var(--acc)}
#mapc{width:100%;border-radius:10px;display:block}
#sel{font-size:14px;min-height:40px}
#trk{position:fixed;top:calc(env(safe-area-inset-top,0px) + 40px);left:8px;max-width:92%;background:rgba(20,30,44,.88);color:#fff;padding:4px 10px;border-radius:10px;font:700 12px 'Trebuchet MS',sans-serif;display:none;pointer-events:none;border-left:3px solid #f2b632}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(242,182,50,.5)}50%{box-shadow:0 0 0 6px rgba(242,182,50,0)}}
.ov{animation:fi .18s}.pn{animation:up .22s ease-out}
.b{box-shadow:0 4px 10px rgba(0,0,0,.35);transition:transform .08s}.b:active{transform:scale(.93)}button.k{transition:transform .08s,filter .15s}button.k:active{transform:scale(.96);filter:brightness(1.15)}
#hud span,#hud button{background:linear-gradient(#2a3c54,#18263a);box-shadow:0 2px 6px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12)}#knob{background:radial-gradient(circle at 35% 30%,#fff,#bcd);box-shadow:0 3px 8px rgba(0,0,0,.4)}#toast{box-shadow:0 4px 14px rgba(0,0,0,.35)}
#dur{position:fixed;right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);width:78px;height:10px;background:rgba(0,0,0,.55);border:1px solid #fff;border-radius:6px;overflow:hidden;pointer-events:none}#dur i{display:block;height:100%;width:100%;background:#59c16b;transition:width .2s}.b.brk{background:#8a2a2a!important}
#cll{position:fixed;top:calc(env(safe-area-inset-top,0px) + 66px);left:8px;max-width:92%;background:rgba(60,30,10,.9);color:#fff;padding:4px 10px;border-radius:10px;font:700 12px 'Trebuchet MS',sans-serif;display:none;pointer-events:none;border-left:3px solid #ff8c28}
#fst{position:fixed;top:calc(env(safe-area-inset-top,0px) + 92px);left:8px;max-width:92%;background:rgba(40,20,60,.9);color:#fff;padding:4px 10px;border-radius:10px;font:700 12px 'Trebuchet MS',sans-serif;display:none;pointer-events:none;border-left:3px solid #ffd85a}
#tut{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);width:min(340px,90%);background:#fff8e1;color:#3b2a10;border:3px solid #2a1d05;border-radius:16px;padding:10px 14px 12px;display:none;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.35);font-size:14px;pointer-events:none}
#tut b{font-size:16px}#tut p{margin:5px 0 4px;line-height:1.35}#tutq{font-weight:700;color:#8a5a00;font-size:13px}#tutk{float:right;font-size:12px;opacity:.6;font-weight:700}
#tut .tb{display:flex;justify-content:space-between;gap:8px;margin-top:6px}#tut button{pointer-events:auto;border-radius:10px;padding:7px 14px;font-weight:700;font-size:14px;border:2px solid #2a1d05}#tutn{background:var(--acc);color:#2a1d05}#tuts{background:transparent;color:#6b5330;border-color:transparent!important;padding-left:0!important}
#tutr{position:fixed;display:none;z-index:39;pointer-events:none;border:4px solid #f2b632;box-shadow:0 0 0 3px rgba(42,29,5,.6),0 0 18px #f2b632;animation:tutp 1.1s ease-in-out infinite}
@keyframes tutp{50%{transform:scale(1.08);opacity:.7}}
@media (orientation:landscape) and (max-height:600px){
#toast{top:calc(env(safe-area-inset-top,0px) + 40px);left:auto;right:calc(env(safe-area-inset-right,0px) + 8px);transform:none;max-width:44%;font-size:13px;padding:6px 10px;text-align:left}
#trk,#cll,#fst{max-width:48%}
#lotp{bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
#tut{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:min(330px,40%);font-size:13px;padding:8px 12px 10px}
#tut b{font-size:14px}#tut p{margin:3px 0}#tut button{padding:5px 12px;font-size:13px}
}
</style></head><body>
<canvas id="c"></canvas>
<div id="tutr"></div><div id="tut"><span id="tutk"></span><b id="tutt"></b><p id="tutp"></p><div id="tutq"></div><div class="tb"><button id="tuts">Skip tutorial</button><button id="tutn">Next</button></div></div>

<script>
/* ===== MAP: winding roads, terrain biomes, lots with driveways, shaped buildings ===== */
const W=100,H=116,MT=34,cv=document.getElementById('c'),g=cv.getContext('2d'),$=id=>document.getElementById(id);
const hash=(x,y)=>{let h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0)%1000/1000};
const road=[],snow=[],solid=[],TER=[];for(let y=0;y<H;y++){road.push(new Array(W).fill(0));snow.push(new Array(W).fill(0));solid.push(new Array(W).fill(0));TER.push(new Array(W).fill(0))}
const inB=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const TR=[{n:'Rusty Plow',minY:80,cost:0},{n:'Ridge Plow',minY:58,cost:920},{n:'Alpine Plow',minY:34,cost:2760},{n:'Summit Plow',minY:10,cost:7500}];
const BIO=(x,y)=>y<34?'summit':y<58?'alpine':y<80?'forest':'town';
function spline(pts,step){const o=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)],n=Math.max(1,Math.ceil(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
 for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t,f=j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);o.push([f(0),f(1)])}}o.push(pts[pts.length-1].slice());return o}
/* terrain */
function blob(cx,cy,rx,ry,val,seed){for(let y=Math.floor(cy-ry-2);y<=cy+ry+2;y++)for(let x=Math.floor(cx-rx-2);x<=cx+rx+2;x++){if(!inB(x,y))continue;const n=(hash(x*3+seed,y*7+seed)-.5)*.5,d=((x+.5-cx)/rx)**2+((y+.5-cy)/ry)**2;if(d<1+n)TER[y][x]=val}}
function stream(pts,r,val){spline(pts,.3).forEach(([px,py])=>{for(let y=Math.floor(py-r);y<=py+r;y++)for(let x=Math.floor(px-r);x<=px+r;x++)if(inB(x,y)&&Math.hypot(x+.5-px,y+.5-py)<=r)TER[y][x]=val})}
stream([[-1,79],[12,78.5],[26,80.5],[40,78.5],[54,79.5],[66,81],[75,84]],1.35,1);
blob(84.5,86.5,11,5,2,7);
[[90,52,3.5,2.5],[70,40,3,2],[14,28,4,3],[86,30,4,2.5],[30,18,3,2],[82,14,3.5,2.5],[6,60,3,4],[94,70,2.5,3.5],[20,40,2,1.6],[56,20,2.5,2]].forEach((c,i)=>blob(c[0],c[1],c[2],c[3],3,i*13));
/* roads */
const CL=[],RPTS={},RT={};
function roadPath(name,pts){const sp=spline(pts,.2);RPTS[name]=sp;const RS=RT[name]=new Set(),put=(X,Y)=>{if(inB(X,Y)){RS.add(Y*W+X);road[Y][X]=1;snow[Y][X]=1;if(TER[Y][X]!==1)TER[Y][X]=0}};
 let lm=null,lc=0,lr=0;sp.forEach(([x,y],i)=>{const a=sp[Math.max(0,i-4)],b=sp[Math.min(sp.length-1,i+4)],hz=Math.abs(b[0]-a[0])>=Math.abs(b[1]-a[1]);
  if(hz){const X=Math.floor(x),r=Math.round(y)-1;if(lm==='h'&&X===lc)return;put(X,r);put(X,r+1);if(lm==='h'&&Math.abs(r-lr)>1){const d=Math.sign(r-lr);for(let k=lr+2*d;k!==r+(d>0?0:1);k+=d)put(X,k)}lm='h';lc=X;lr=r}
  else{const Y=Math.floor(y),c=Math.round(x)-1;if(lm==='v'&&Y===lr)return;put(c,Y);put(c+1,Y);if(lm==='v'&&Math.abs(c-lc)>1){const d=Math.sign(c-lc);for(let k=lc+2*d;k!==c+(d>0?0:1);k+=d)put(k,Y)}lm='v';lc=c;lr=Y}});
 for(let i=0;i+1<sp.length;i+=7){const a=sp[i],b=sp[i+1];CL.push([a[0],a[1],Math.atan2(b[1]-a[1],b[0]-a[0])])}}
roadPath('main',[[-1,96],[10,95],[22,97.5],[34,95.5],[46,97.5],[58,95.5],[70,97.5],[84,95.5],[101,96.5]]);
roadPath('south',[[14,96.5],[12,103],[18,110],[32,112],[48,111],[64,112],[75,110],[80,104],[78,97.5]]);
roadPath('mtn',[[50,97],[51,91],[48,85],[49,79],[53,75],[64,73],[78,70],[85,64],[76,60],[60,61],[44,63],[30,61],[26,56],[31,51],[46,49],[62,51],[77,47],[84,41],[74,36],[58,37],[44,35],[36,31],[42,26],[58,25],[72,22],[74,16],[60,13],[46,12],[34,11]]);
roadPath('cedar',[[44,63],[36,68],[24,70],[14,66],[10,62]]);
/* sidewalks: one clean strip on each side of Main Street through the village */
for(let x=16;x<72;x++){let top=-1,bot=-1;for(let y=88;y<104;y++)if(RT.main.has(y*W+x)){if(top<0)top=y;bot=y}if(top<0)continue;for(const y of[top-1,bot+1])if(!road[y][x]&&TER[y][x]!==1&&TER[y][x]!==2){road[y][x]=2;TER[y][x]=5}}
/* plaza */
for(let y=105;y<=109;y++)for(let x=30;x<=46;x++){road[y][x]=2;TER[y][x]=4}
/* parking lots: pad + one road-wide driveway */
const LOTS=[
{n:'Home Driveway',x0:12,y0:89,x1:14,y1:92,e:'s',at:13,tier:0,rate:0,home:1},
{n:'Bakery Lot',x0:27,y0:88,x1:32,y1:92,e:'s',at:29,tier:0,rate:6},
{n:'Shop Lot',x0:35,y0:82,x1:42,y1:85,e:'e',at:83,tier:0,rate:6},
{n:'Garage Lot',x0:67,y0:86,x1:72,y1:91,e:'s',at:69,tier:0,rate:6},
{n:'Rink Lot',x0:75,y0:91,x1:80,y1:93,e:'s',at:77,tier:0,rate:6},
{n:'Library Lot',x0:15,y0:100,x1:18,y1:104,e:'n',at:16,tier:0,rate:6},
{n:'Hall Lot',x0:44,y0:100,x1:48,y1:103,e:'n',at:46,tier:0,rate:6},
{n:'Clinic Lot',x0:62,y0:100,x1:67,y1:104,e:'n',at:64,tier:0,rate:6},
{n:'Lodge Lot',x0:2,y0:99,x1:9,y1:101,e:'n',at:4,tier:0,rate:6},
{n:'Arena Lot',x0:86,y0:107,x1:97,y1:111,e:'w',at:109,tier:0,rate:7},
{n:'Ridge Cabin Lot',x0:14,y0:72,x1:20,y1:76,e:'n',at:16,tier:1,rate:14},
{n:'Ridge East Lot',x0:66,y0:63,x1:72,y1:66,e:'n',at:68,tier:1,rate:14},
{n:'Ridge South Lot',x0:56,y0:66,x1:62,y1:70,e:'s',at:58,tier:1,rate:14},
{n:'Cabin Lot',x0:50,y0:42,x1:57,y1:46,e:'s',at:53,tier:2,rate:24},
{n:'Overlook Lot',x0:86,y0:44,x1:92,y1:49,e:'w',at:45,tier:2,rate:24},
{n:'Ski Hill Lot',x0:12,y0:43,x1:24,y1:53,e:'e',at:49,tier:2,rate:30,cd:3},
{n:'Summit Lot A',x0:62,y0:17,x1:67,y1:20,e:'e',at:18,tier:3,rate:45},
{n:'Summit Lot B',x0:36,y0:14,x1:42,y1:18,e:'n',at:38,tier:3,rate:45},
{n:'Crest Lot West',x0:24,y0:27,x1:31,y1:31,e:'e',at:28,tier:3,rate:45},
{n:'Crest Lot East',x0:64,y0:27,x1:71,y1:31,e:'n',at:67,tier:3,rate:45}];
const DIRS={n:[0,-1],s:[0,1],e:[1,0],w:[-1,0]};
LOTS.forEach(l=>{l.tiles=[];l.pad=new Set();for(let y=l.y0;y<=l.y1;y++)for(let x=l.x0;x<=l.x1;x++){l.tiles.push([x,y]);l.pad.add(y*W+x)}
 const d=DIRS[l.e];l.drive=[];l.ok=false;for(let k=1;k<=9&&!l.ok;k++){const row=[];for(let j=0;j<2;j++){let x,y;if(d[0]===0){x=l.at+j;y=(d[1]<0?l.y0:l.y1)+d[1]*k}else{y=l.at+j;x=(d[0]<0?l.x0:l.x1)+d[0]*k}row.push([x,y])}
  if(row.some(([x,y])=>inB(x,y)&&road[y][x]==1)){l.ok=true;break}row.forEach(t=>l.drive.push(t))}
 l.drive.forEach(t=>l.tiles.push(t));l.tiles.forEach(([x,y])=>{if(inB(x,y)){road[y][x]=3;snow[y][x]=1;TER[y][x]=0}})});
/* buildings: footprint parts with real-world shapes */
const BP=(dx,dy,w,h,st,o)=>Object.assign({dx,dy,w,h,st},o||{});
const B=[
{id:'home',x:3,y:88,w:9,h:5,dx:3,col:'#d9cdb8',roof:'#3c5a78',l:'Home',wt:'plaster',up:1,parts:[BP(0,0,6,5,'side',{ch:[1,-.2]}),BP(6,1,3,4,'side',{gar:1})]},
{id:'bakery',x:20,y:87,w:6,h:6,dx:3,col:'#b5543a',roof:'#d9a15a',l:'Bakery',wt:'brick',up:2,parts:[BP(0,0,6,6,'front',{awn:['#e07a9a','#f4f0e6'],disp:1,ch:[4.4,-1.2]})]},
{id:'shop',x:34,y:87,w:8,h:6,dx:4,col:'#9a6a46',roof:'#6b5040',l:"John's",wt:'plank',up:1,parts:[BP(0,0,8,6,'false',{sign:"JOHN'S",porch:1})]},
{id:'lodge',x:0,y:103,w:11,h:7,dx:6,col:'#7a5238',roof:'#2f5d4a',l:'Lodge',wt:'log',up:1,parts:[BP(0,0,11,6,'side',{dorm:1,ch:[1.5,-.6],stone:1}),BP(4,1,4,6,'front',{posts:1})]},
{id:'hall',x:33,y:100,w:10,h:5,dx:5,col:'#c9c3ba',roof:'#5c4a7a',l:'Town Hall',wt:'stone',up:3,parts:[BP(0,1,10,4,'hip',{cols:1}),BP(4,0,2,5,'tower',{clock:1})]},
{id:'library',x:20,y:100,w:8,h:6,dx:4,col:'#7a4a3a',roof:'#35404f',l:'Library',wt:'brick',mort:'#a89a8a',up:1,parts:[BP(0,0,8,5,'hip',{arch:1}),BP(2,1,4,5,'front',{cols:1,pedi:1})]},

function footTalk(){let bid=null,bd=1.9;for(const id in D){const d=Math.hypot(S.x-D[id][0],S.y-D[id][1]);if(d<bd){bd=d;bid=id}}
 const n=near(2.4);if(n&&(!bid||Math.hypot(n.x-S.x,n.y-S.y)<bd)){npcTalk(n);return}
 if(bid){if(isOpen(bid))enterB(bid);else toast(INT[bid].nm+' is closed right now.');return}
 if(waterAt(S.x,S.y+.2)){startFish();return}toast(Math.hypot(S.x-S.tx,S.y-S.ty)<2.6?'Tap Get in truck to drive.':'Walk to a door and tap INTERACT to go inside.')}
const TIPS=['Any fully snow-covered parking lot can be plowed once a day. You get paid when every tile is clear.','Every neighbor has a favorite gift. Give it to them for a big friendship boost.','Sleep at home after 6 PM. Every road is buried in snow again the next morning.','Higher roads pay more per tile. Save for a better truck.','Workers clear the roads below your current stage, so you can focus on the mountain.','Drive up to the garage door to pull your truck onto Sam\'s lift. Truck upgrades are sold there, any time of day.','The Wolves play a home game every 3 or 4 days. Plow the Arena Lot by 6 PM. The Wolves Game starts at 7 PM.','Neighbors and visitors only drive and walk on plowed roads, so plow the streets to bring the town to life.','Lift the plow on bare pavement. It wears out much faster there, and Sam restores it at the garage.'];
function openShop(m){if(typeof TUTF!=='undefined')TUTF.shop=1;S.shopMode=m;$('shopT').textContent=SHOPN[m];$('shop').style.display='flex';render()}
function actNear(){let best=null,bd=1.5;for(const f of ff(S.in)){if(!f.act)continue;const dx=Math.max(f.x-S.x,0,S.x-(f.x+f.w)),dy=Math.max(f.y-S.y,0,S.y-(f.y+f.h)),d=Math.hypot(dx,dy);if(d<bd){bd=d;best=f}}return best}
function actPrompt(ox,oy,T){{const n=near(2.6);if(n&&!ownBusy(n))return}const f=actNear();if(!f||(f.k==='lift'&&S.inTruck))return;const a=f.act;let t={sleep:'Sleep',shop:'Shop',garage:'Garage services',clinic:'Clinic',board:'Parking lot board',read:'Read a book',radio:'Listen to the radio',archive:'Frostvale Archive',wardrobe:'Change outfit',revival:'Frostpine Revival Board'}[a];if(a.startsWith('store:'))t='Shop';if(a.startsWith('buy:')){const p=a.split(':');t='Buy '+IT[p[1]][1].toLowerCase()+'  $'+p[2]}if(!t)return;
 g.font='bold '+T*.3+'px sans-serif';const tw=g.measureText(t).width+T*.5,bx=Math.max(4,Math.min(cv.width-tw-4,ox+(f.x+f.w/2)*T-tw/2)),by=(OWN[S.in]&&ownCounter(S.in)===f&&ownPos(S.in))?oy+(f.y+f.h)*T+T*.2:oy+f.y*T-T*.95-Math.abs(Math.sin(S.t*3))*T*.05;
 g.fillStyle='rgba(20,28,40,.85)';g.beginPath();g.roundRect?g.roundRect(bx,by,tw,T*.55,T*.15):g.rect(bx,by,tw,T*.55);g.fill();g.beginPath();g.moveTo(bx+tw/2-T*.12,by+T*.55);g.lineTo(bx+tw/2,by+T*.7);g.lineTo(bx+tw/2+T*.12,by+T*.55);g.fill();g.fillStyle='#ffd877';g.textAlign='center';g.fillText(t,bx+tw/2,by+T*.38)}
function intTalk(){const n=near(2.6);if(n&&!(ownBusy(n)&&actNear())){npcTalk(n);return}let best=null,bd=1.5;
 for(const f of ff(S.in)){if(!f.act)continue;const dx=Math.max(f.x-S.x,0,S.x-(f.x+f.w)),dy=Math.max(f.y-S.y,0,S.y-(f.y+f.h)),d=Math.hypot(dx,dy);if(d<bd){bd=d;best=f}}
 if(!best){toast('Nothing to use here. Walk south to leave.');return}const a=best.act;
 if(a==='shop'||a==='garage'||a==='clinic')openShop(a);else if(a==='board')openBoard();else if(a==='sleep')sleep();
 else if(a.startsWith('store:'))openShop(a.slice(6));
 else if(a==='radio')radioTalk();
 else if(a==='archive')archOpen();
 else if(a==='wardrobe')wardOpen();
 else if(a==='revival'){S.rv.intro=1;revOpen()}
 else if(a==='read')dlg('Library',[TIPS[Math.random()*TIPS.length|0]]);
 else if(a.startsWith('buy:')){const p=a.split(':'),k=p[1],c=+p[2];if(S.money>=c){S.money-=c;S.inv[k]++;toast('Bought '+IT[k][1]+' for $'+c+'.')}else toast('Not enough money.')}}
let DQ=[],DC=null;
function dlg(n,pages,cb){DQ=pages.slice();DC=cb;$('dn').textContent=n;$('dlg').style.display='flex';dnext()}

$('dnext').onclick=dnext;
function npcTalk(n){
 if(n.n==='Mabel'&&S.sq==0){S.sq=1;n.talked=1;addFP(n,25);dlg('Mabel',['Well hello! You must be the new plow driver. I am Mabel, and I run the bakery.','Here is how things work around here. Every neighbor has hearts for you. Talk to someone once a day and your friendship grows a little. A full heart takes several days. Open Menu, then Friends, to see how everyone feels about you.','Gifts earn hearts too. Open Menu, then Items, stand next to someone and tap Give. They like most things, but each person has one favorite that they love.','Take these two cookies. My neighbor Pip has a sweet tooth. Go say hello to him!'],()=>{S.inv.cookie+=2;toast('Mabel gave you 2 cookies. Quest: find Pip.')});return}
 if(n.n==='Pip'&&S.sq==1){S.sq=2;n.talked=1;addFP(n,25);dlg('Pip',['Hi! You drive the big plow truck, right? That is so cool!','Mabel sent you? Then you must have cookies. Cookies are my favorite!','Open Menu, tap Items, pick a cookie and tap Give while you are standing next to me.'],()=>toast('Quest updated: give Pip a cookie.'));return}
 if(sagaTalk(n))return;if(heartInvite(n))return;if(questTalk(n))return;if(!n.talked){n.talked=1;addFP(n,25);if(n.h>=4&&GFT[n.n]&&(n.n!=='Ivy'||Math.random()<.35)){S.inv[GFT[n.n]]++;toast(n.n+' gave you '+IT[GFT[n.n]][1]+'!');return}toast(n.n+' '+'♥'.repeat(n.h)+': '+n.L[n.i=(n.i+1)%3])}else toast(n.n+': Good to see you again!')}
function addFP(n,pts){const oh=n.h;n.fp=Math.min(1000,(n.fp||0)+pts);n.h=Math.floor(n.fp/100);const e=evNext(n);if(e&&S.sq>=4&&oh<e[0]&&n.h>=e[0]&&!S.hinv[n.n])setTimeout(()=>toast('♥ '+n.n+' has something to tell you. Go say hello!'),5200)}
function giveGift(n){const k=S.sel;if(!k||!S.inv[k])return;if(n.gifted){toast(n.n+' already got a gift today. Try again tomorrow.');return}
 S.inv[k]--;n.gifted=1;const fav=n.fav===k,pts=giftPts(n,k);addFP(n,pts);n.emo=2.5;n.emoK=fav?'♥':'♪';if(!S.inv[k])S.sel=null;pRender();
 if(S.sq==2&&n.n==='Pip'&&k==='cookie'){S.sq=3;$('pause').style.display='none';dlg('Pip',['A cookie?! Thank you!!','Here is a secret: everybody has a favorite gift. Mine is cookies, so you earned extra friendship with me.','You can only give each person one gift a day, so make it count. Mabel loves hot cocoa, and Rosa sells it at the lodge!'],()=>toast('Quest updated: give Mabel a hot cocoa.'));return}
 if(S.sq==3&&n.n==='Mabel'&&k==='cocoa'){S.sq=4;S.money+=200;$('pause').style.display='none';dlg('Mabel',['Hot cocoa, my favorite! You remembered!','That is how friendship works here. Talk daily, bring gifts people love, and over time the hearts add up.','Good neighbors help each other, so here is $200 for being so thoughtful.'],()=>toast('Quest complete: Meet the Neighbors! +$200'));return}
 toast(n.n+(fav?' LOVES it! +':' liked it. +')+pts+' friendship')}
function storyTxt(){const t=['Find Mabel in her bakery, west of the main road in the lower town. She is behind the counter from 6 AM.','Find Pip. Check the town square, the hall or the streets.','Give Pip a cookie: Menu, Items, pick the cookie, then Give while next to him.','Give Mabel a hot cocoa, her favorite. Buy one at the lodge, the arena or the ski lodge.'];
 return S.sq<4?`<div class="item"><div>Meet the Neighbors<small>${t[S.sq]}</small></div></div>`:'<div class="item"><small>Meet the Neighbors: complete ✅</small></div>'}

/* --- heart events: [hearts, place, from, to, invite, title, scene lines, question, options[[text,reply,bonus]], letter, gift] --- */
const HE={
 Mabel:[[2,'bakery',6,10,"Come by the bakery early, before I open. Six to ten in the morning. I could use a taste-tester.","Flour at Dawn",["You're here! Quick, before the ovens get too hot.","This is Grandma's cardamom twist. I've baked it a hundred times and it never tastes like hers."],"Be honest. What's missing?",[["More cardamom, maybe?","Hm. Maybe a little more. She was never shy with spice.",15],["Maybe it's not the recipe. Maybe it's the company.","...She always baked with someone in the kitchen. Stay a while longer, would you?",40]],"I baked the twist again this morning with the radio on and the door open. Closer than ever. A loaf for you.","bread"],
  [5,'plaza',12,16,"There's something I want to show you in the town square. Come by after noon.","The Bench by the Tree",["This bench. Grandma and I sold cocoa here every Winter Fair.","I haven't run a stall since she passed. People keep asking."],"Do you think I should bring it back this year?",[["You should. The town misses it.","You're right. I'll dust off her old cart. You'd better buy the first cup!",40],["Only if it feels right for you.","Thank you for saying that. I think... it does feel right. Finally.",30]],"The cocoa cart is polished and ready. The first cup is yours, no charge, forever.","cocoa"],
  [8,'home',18,23,"Can I stop by your place this evening, after six? I'm bringing something.","A Key to the Kitchen",["Knock knock! Don't worry, I won't stay long.","This is the spare key to the bakery. Grandma gave hers to the one person she trusted most."],"I'd like you to have it. What do you say?",[["I'll take good care of it.","I know you will. Come in any time. There will always be something warm on the counter.",40],["Are you sure? That's a big deal.","I've never been more sure. You plow the road to my door every single morning.",40]],"Spare cookies are in the blue tin. Help yourself, keyholder.","pie"]],
 John:[[2,'shop',8,12,"Swing by the shop in the morning, would you? Between eight and noon.","The Inventory",["Every winter I count every bolt in this store. Every single one.","My father did it, and his father. Honestly, I think it's mostly an excuse to remember them."],"Want to count washers with an old man?",[["Sure. Hand me a bin.","Ha! A natural. Four hundred and twelve. Dad would have liked you.",40],["Isn't there an easier way?","Probably! But then I wouldn't get these quiet mornings.",15]],"The count came out perfect. First time in thirty years. I think you're good luck.","flashlight"],
  [5,'corner',16,20,"Meet me at the corner by the lake road, four o'clock or later. Bring your thinking cap.","Plans in the Snow",["I've been sketching. A covered walkway from the shops to the lake, so folks can stroll in any weather.","The co-op thinks I'm dreaming too big."],"What do you think?",[["Dream big. I'll plow the path for it.","Then it's a deal. Ha! Wait till the co-op hears THAT.",40],["Maybe start with a smaller piece?","A smart builder starts with one beam. You're right.",30]],"The co-op approved phase one. Your name is on the plans as Chief Snow Consultant.","wrench"],
  [8,'lodge',18,23,"The lodge, tonight after six. I have a story nobody else in town knows.","The Night of '79",["Winter of '79, the storm cut the valley off for nine days.","My father drove the only plow. I rode along, eight years old, handing him coffee.","He told me a town is just roads and the people who show up. You remind me of him."],"",[["That means a lot, John.","It should. I don't say it lightly. Here's to the people who show up.",40],["Tell me more about him.","He sang off-key the whole time. Terrible voice. Best man I ever knew.",40]],"Found Dad's old thermos in the back. It's yours now. Fill it with something warm.","cocoa"]],
 Pip:[[2,'park',12,17,"Meet me at the park after lunch! It's TOP SECRET.","Snow Fort Command",["Halt! Password?","...Close enough. Welcome to Snow Fort Command."],"Every fort needs a general. Will you be my second-in-command?",[["Reporting for duty, General Pip!","YES! Your first mission: be awesome. You're already doing it!",40],["Can I be the general?","Hmm... we can take turns. Tuesdays are yours!",30]],"Fort report: zero dragons spotted. Thanks to you. Here is a cookie as payment. - General Pip","cookie"],
  [5,'library',12,17,"Can you meet me at the library this afternoon? I'm writing a book and I need help!","The Dragon of Frostvale",["My book is about a dragon who's scared of snow.","But I don't know how it ends. Does the dragon learn to like snow?"],"What do you think happens?",[["A friend shows the dragon how fun snow can be.","That's PERFECT. The friend drives a plow. Guess who that is.",40],["The dragon melts all the snow!","Ha! Then you'd have no job. I'll think of something cozier.",15]],"Chapter 1 done! The dragon is named Sparky and the plow driver is named after you.","book"],
  [8,'pond',13,18,"Meet me at the pond before dark? I want to show you something I learned.","First Skate",["Watch! Lucy taught me!","...Okay, I fell. But I got up! That's the important part, right?"],"You'll always help me up, right?",[["Always, buddy.","Best. Sidekick. Ever. Wait, maybe I'm YOUR sidekick now.",40],["You'll get it. Keep trying!","I will! And next time you're skating with me.",30]],"I skated all the way across without falling!!! (Almost.)","cocoa"]],
 'Old Hank':[[2,'lodge',18,23,"I sit by the lodge fire most nights. Join an old man after six?","By the Fire",["Sit, sit. Pull that chair closer, the good one's by the hearth.","Elsie and I sat right here every Friday for forty years."],"Do you have a place like this? Somewhere that feels like home?",[["I think this town is becoming that.","Good. That's how it starts. One chair by one fire.",40],["Still looking.","You'll find it. Some folks find it in a place. Some find it in people.",30]],"Saved you the good chair again tonight.","tea"],
  [5,'arena',10,16,"Meet me at the arena in the daytime. I want to show you the old net.","The 1971 Net",["This net. I stopped forty-one shots in it the night we won the cup.","My knees won't let me play now, but my hands still remember."],"Want to take a shot at an old goalie?",[["Let's see what you've got, Hank!","Ha! Save! You shoot like a plow driver. That's a compliment.",40],["I'd rather hear about the game.","Third period, two minutes left, and the lights flickered...",30]],"Showed the kids how to stand in the crease today. Haven't felt that young in years.","puck"],
  [8,'west',14,19,"Walk with me on the west road this afternoon? There's a place I visit.","Elsie's Pine",["This pine. Elsie planted it as a sapling, the year we married.","I come here and tell her the news. Today I told her about you."],"She'd have liked you. Would you visit her with me sometimes?",[["I'd be honored, Hank.","Then it's a standing date. She always did like company.",40],["What did you tell her?","That the roads are clear and the town has a new good egg.",40]],"Tied a red ribbon on Elsie's pine. Her favorite color. Thought you should know.","candle"]],
 Ivy:[[2,'library',9,13,"Come to the library before noon. I found something in the archive.","Margins",["Look, notes in the margins of this 1952 almanac. Someone wrote a plow route by hand.","Every winter, somebody in this town has done what you do."],"Would you like to add your name to the margins?",[["Hand me a pencil.","There. Part of the record now. Future readers will wonder who you were.",40],["Leave it for history.","Modest. I'll write it in for you when you're not looking.",30]],"I made a new archive box with your name on it. It's mostly route notes so far.","postcard"],
  [5,'hall',13,17,"Meet me at Town Hall this afternoon. I'm presenting a proposal and I'm terrified.","The Proposal",["I want the library open late in winter. Warm lights, cocoa, readings.","The council will ask who would even come in a storm."],"Would you... come?",[["Every snowy night.","Then I'll tell them I already have one regular. That's a start.",40],["Ask the whole town!","A petition! Why didn't I think of that? You're brilliant.",30]],"Approved! Late hours start this week. Your reading chair has a little sign on it now.","tea"],
  [8,'library',14,18,"Stay at the library past two tomorrow. There's something I've never told anyone.","The Unwritten Book",["I've started forty-one novels. I've finished none.","But I've been writing about this winter. The roads, the people. It's... going well."],"Would you read the first page?",[["I'd love to.","You're reading it, I'm watching your face, this is awful, keep going.",40],["Finish it first, then I'll read it all.","A deadline. I've never had a reader waiting. That changes everything.",40]],"Chapter six. The plow driver character got a dog. Don't ask.","scarf"]],
 Sam:[[2,'garage',18,23,"Garage, after six. Bring snacks if you got 'em.","Grease and Stars",["Pull up a crate. I'm rebuilding this old carburetor for fun.","People think fixing stuff is about tools. It's about listening."],"Hold this. Hear that? What does it sound like to you?",[["Like it's purring.","Exactly! You've got the ear. Most folks never learn to hear it.",40],["Like noise.","Ha! Give it time. Engines are shy.",15]],"That carburetor's in your truck now. Free. Don't tell John, he'll want one.","oil"],
  [5,'corner',12,16,"Meet me at the corner by the lake road around noon. I need a second opinion.","The Tow Truck Dream",["See that rusty tow truck behind the fence? Out of service since '98.","I want to fix her up so nobody in this valley ever waits for a tow again."],"Crazy idea?",[["Best idea I've heard all winter.","Then we're doing it. You're on wheel duty, I'm on everything else.",40],["Expensive, but a good one.","Real talk. I respect that. I'll save up. Slow and steady.",30]],"Tow truck update: she starts! She also backfires. Progress!","wrench"],
  [8,'garage',6,10,"Come to the garage early. Sunrise. Trust me.","Sunrise Test Drive",["She runs! The old tow truck, purring like a kitten.","First drive goes to whoever believed in her first. That's you."],"Where should we take her?",[["Up the mountain road to watch the sun.","Good call. Best view in the valley from up there.",40],["Once around the town square, slowly.","A victory lap! I like it. Wave at Mabel!",40]],"Named the tow truck after you. Don't argue. It's painted on the door.","oil"]],
 'Dr. June':[[2,'clinic',9,13,"Visit the clinic in the morning. No, you're not sick. I have a question.","House Calls",["I'm starting winter house calls for folks who can't get to town.","But I need roads I can trust at five in the morning."],"Can I count on you to keep the hill roads clear?",[["You can count on me.","Then I'll put you down as my emergency partner. Officially.",40],["I'll do my best.","Your best has been excellent so far.",30]],"First house call done. Mrs. Pell made me pie and asked all about you.","pie"],
  [5,'plaza',18,23,"Find me in the town square tonight after six. I need fresh air.","Night Shift",["Long day. Three sprains, one frostbite, one very dramatic toddler.","Sometimes I forget to stop and look up."],"Look. You can see the whole winter sky tonight.",[["Let's just stay a while.","...Thank you. I needed someone to make me stop.",40],["You should take a day off.","Doctor's orders, from a plow driver. Fine, I'll consider it.",30]],"I took Sunday off. First one in a year. I slept until nine.","candle"],
  [8,'clinic',12,17,"Come to the clinic this afternoon. I want to show you something on the wall.","The Thank-You Wall",["This wall is every thank-you card the clinic ever got.","This new one says 'The roads were clear, so I made it in time.' It's about you."],"How does that feel?",[["I had no idea.","Now you do. You save lives too. You just use a bigger tool.",40],["It's a team effort.","Humble. Fine. Team Clear Roads, then. Captain: you.",40]],"Framed a photo of your truck for the wall. Patients point at it.","soup"]],
 Rosa:[[2,'lodge',6,10,"Morning at the lodge, before the guests wake? I always make breakfast for one extra.","Second Breakfast",["Sit, eat. Nobody plows on an empty stomach in my lodge.","My mother ran this place. She fed every traveler who came in from a storm."],"Is it good?",[["Best pancakes in the valley.","Mama's recipe. Now I know you have taste.",40],["What's the secret ingredient?","Snow-cold buttermilk and too much butter. Don't tell Dr. June.",30]],"Your plate is always set at the end of the counter now.","tea"],
  [5,'lodgeOut',16,20,"Meet me outside the lodge this evening. I need help with the lights.","Lighting the Lodge",["Every winter I hang these lights, and every winter they tangle.","My mother used to hum while she untangled them. I can't remember the song."],"Hum something with me?",[["Hum an old winter tune.","...That's it! That's her song. How did you know?",40],["Just untangle in silence.","Quiet's nice too. The lights look better with two people anyway.",30]],"The lights have never looked better. I hummed the whole time.","candle"],
  [8,'lodge',18,23,"Tonight at the lodge, after six. I'm making a decision and I want you there.","The Guest Book",["Forty years of guest books. Every traveler who ever sheltered here.","I want to write a dedication on the first page of the new one."],"Who should it be dedicated to?",[["To your mother.","Yes. To Mama, who kept the lights on. And... a P.S. for you.",40],["To everyone who comes in from the cold.","Perfect. That includes you, every night.",40]],"The new guest book is open. Page one has your name in the P.S.","pie"]],
 'Coach Dale':[[2,'arena',10,16,"Come by the arena during the day. I could use a hand with the ice.","Fresh Sheet",["Nothing like fresh ice. Smooth as glass.","The kids think hockey is about scoring. It's about getting back up."],"You ever fall hard and get back up?",[["More times than I can count.","Then you'd make a great player. Grab a stick sometime.",40],["I try not to fall.","Ha! Smart. But the falls teach you the most.",30]],"The kids asked if the plow driver could play goal at practice. Think about it.","puck"],
  [5,'pond',12,17,"Meet me at the outdoor rink this afternoon. Pond hockey, old school.","Pond Rules",["Pond hockey has one rule: everybody plays, nobody keeps score.","That's how I learned, on this pond, forty years ago."],"Ready? You take left wing.",[["Pass it here!","Tape to tape! Where've you been all season?",40],["I'll be the cheering section.","Every team needs one. Loudest fan in Frostvale.",30]],"Pond hockey is every Sunday now. Unofficial. You're on the roster.","scarf"],
  [8,'hall',12,17,"Meet me at Town Hall this afternoon. Big announcement.","Team Sponsor",["The Frostvale Wolves need a new jersey sponsor.","I put a name forward to the council. Yours. Well, your plow service."],"Your logo on the jerseys. Deal?",[["Deal! Go Wolves!","GO WOLVES! The kids are going to lose their minds.",40],["Put the town's name on them instead.","Classy. The town it is. But your name goes inside every collar.",40]],"The jerseys came in. Ben cried. Don't tell him I told you.","puck"]],
 Nina:[[2,'plaza',8,12,"Meet me in the town square this morning? I'm hanging trail posters.","Poster Run",["Hold this side. No, higher. Perfect.","Every season I worry nobody will come up the mountain."],"Think anyone will show up?",[["With roads this clear, everyone will.","Ha! Then it's your fault if the lift line is huge.",40],["Make it a free lesson day!","Free lessons... genius. You're hired as my marketing department.",40]],"Forty people showed up! The poster worked. Or the roads. Probably the roads.","map"],
  [5,'lodge',18,23,"Find me at the lodge tonight. I'm hiding from my own fan club.","Off the Slopes",["Everyone thinks I'm fearless. I'm actually scared of heights.","I learned to ski so I'd stop thinking about it."],"Is that weird?",[["That's the bravest thing I've heard.","...Huh. Nobody ever put it that way. Thank you.",40],["Everyone's scared of something.","True. Mine's just really, really tall.",30]],"Rode the top lift today and only screamed a little. Progress!","mittens"],
  [8,'corner',6,10,"Early morning, the lake road corner. Wear warm boots.","First Tracks",["Shh. Look. Fresh snow on the lake, not a single track.","My dad called this 'first tracks.' The best moment of any winter day."],"Want to make them together?",[["Let's go.","...Two lines of tracks across the lake. Those are ours now.",40],["Let's just look a little longer.","You're right. Some things are better before you touch them.",40]],"The lake snowed over again last night. Our tracks are a secret now.","scarf"]],
 Tom:[[2,'hallOut',9,13,"Meet me outside Town Hall this morning. I have a funny one.","The Lost Letter",["This letter was mailed in 1987. I found it behind a sorting shelf.","It's addressed to 'Whoever plows the hill road.' No name."],"Technically... that's you. Want to open it?",[["Open it!","'Thank you for my road home.' That's it. Forty years late and still true.",40],["Let's find out who wrote it.","A mystery! I love this job. I'll check the old route books.",30]],"Traced the 1987 letter! It was from Hank's wife, Elsie. Small world.","postcard"],

  {t:'The Keeper of the Mountain',gate:()=>true,mail:['Ivy','I found a name',"I went through every box in the archive. In 1962 the summit weather station had a keeper named Edmund Pell. He lived up there alone. One day he was just... gone.\n\nThe archive card has a note in pencil: 'Ask Hank.' Hank never talks about the old days. Maybe he'll talk to you. - Ivy"],

  {t:'Footsteps on Pinewood Ridge',gate:tierG(1),mail:['Old Hank','Elsie\'s Friday walks',"Couldn't sleep after we talked. Elsie took the old logging road up Pinewood Ridge every Friday.\n\nYou've got a truck that can climb now. Would you drive up and look around? I don't know what for. Anything of hers. - Hank"],

  {t:'The Highland Waystation',gate:tierG(2),mail:['Ivy','A map in the margins',"Edmund drew a tiny hut on an old trail map, halfway up the Highland Pass, marked 'waystation.' If the lights are a beacon, the waystation might be where he kept spare lamps.\n\nThe pass is dark at night. Go after 6 PM and look for a glow. - Ivy"],
